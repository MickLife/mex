
[tool.ruff]
target-version = "py312"
preview = false
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "A",
  "N",
  "B",
  "C9",
  "NPY",
  "COM",
  "T20",
  "SLF",
  "TID",
  "I",
  "ARG",
  "S",
  "SIM",
  "Q002",
  "UP",
  "PD",
  "C4",
  "DTZ",
  "PYI",
  "TC",
  "PL",
]
extend-select = ["E303", "E266"]
ignore = ["I001", "UP035", "B905", "C408", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG002", "ARG005", "SLF001"]
# 提示词模板的文本行（含 JSON 示例）天然超出行宽，拆行会改变发给 LLM 的内容
"src/mex/llm/prompts.py" = ["E501"]

[project]
name = "mex"
version = "0.1.0"
description = "meX: a local-first personal memory system for user profiles and event memories"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["memory", "personal-memory", "user-profile", "agent", "local-first", "sqlite", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "loguru>=0.7.3",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/MickLife/mex"
Repository = "https://github.com/MickLife/mex"

[project.scripts]
mex = "mex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mex"]

[tool.hatch.build.targets.wheel.force-include]
"src/mex/templates" = "mex/templates"
"src/mex/integration" = "mex/integration"
"src/mex/store/schema.sql" = "mex/store/schema.sql"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/mex"]

